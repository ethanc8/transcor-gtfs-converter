[workspace]
name = "transcor-gtfs-converter"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.12,<3.14"
requests = ">=2.31"
timezonefinder = ">=6.5"
pytest = ">=8"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[tasks]
fetch = "python -m tds_gtfs fetch"
convert = "python -m tds_gtfs convert"
import-har = "python -m tds_gtfs import-har"
queries = "python -m tds_gtfs queries"
release-index = "python -m tds_gtfs release-index"
test = "pytest -q tests"
